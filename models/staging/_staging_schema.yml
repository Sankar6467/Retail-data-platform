version: 2

models:
  - name: stg_customers
    description: One row per customer, lightly cleaned/cast from RAW.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: email
        data_tests:
          - not_null

      - name: loyalty_tier
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - BRONZE
                  - SILVER
                  - GOLD
                  - PLATINUM

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

      - name: unit_price
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: stg_stores
    columns:
      - name: store_id
        data_tests:
          - unique
          - not_null

      - name: store_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ONLINE
                  - PHYSICAL

  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - COMPLETED
                  - CANCELLED
                  - REFUNDED
                  - PENDING

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: quantity
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false

  - name: stg_inventory_snapshots
    columns:
      - name: store_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id

      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id