version: 2

models:
  - name: stg_customers
    description: One row per customer, lightly cleaned/cast from RAW.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [not_null]
      - name: loyalty_tier
        tests:
          - accepted_values:
              values: ['BRONZE', 'SILVER', 'GOLD', 'PLATINUM']

  - name: stg_products
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: unit_price
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_stores
    columns:
      - name: store_id
        tests: [unique, not_null]
      - name: store_type
        tests:
          - accepted_values:
              values: ['ONLINE', 'PHYSICAL']

  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_status
        tests:
          - accepted_values:
              values: ['COMPLETED', 'CANCELLED', 'REFUNDED', 'PENDING']

  - name: stg_order_items
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: quantity
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false

  - name: stg_inventory_snapshots
    columns:
      - name: store_id
        tests:
          - relationships:
              to: ref('stg_stores')
              field: store_id
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
