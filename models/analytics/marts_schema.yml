version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        data_tests:
          - unique
          - not_null

  - name: dim_customer
    columns:
      - name: customer_key
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

  - name: dim_product
    columns:
      - name: product_key
        data_tests:
          - unique
          - not_null

      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: dim_store
    columns:
      - name: store_key
        data_tests:
          - unique
          - not_null

      - name: store_id
        data_tests:
          - unique
          - not_null

  - name: fct_sales
    description: One row per order line item. Grain enforced by unique test below.

    columns:
      - name: sales_key
        data_tests:
          - unique
          - not_null

      - name: order_item_id
        data_tests:
          - unique
          - not_null

      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key

      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key

      - name: store_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_store')
                field: store_key

      - name: quantity
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 100

      - name: line_total
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100000

      - name: gross_margin_pct
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1